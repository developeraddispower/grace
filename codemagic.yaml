workflows:
  expo-android:
    name: Expo Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 18.17.0
      npm: 9.6.7
      groups:
        - expo_credentials
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android APK
        script: |
          npx eas-cli build --platform android --profile preview --non-interactive
    artifacts:
      - build/**/*.apk
